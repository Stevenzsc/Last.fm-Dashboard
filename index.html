    renderObsessionText(item) {
        const subject = String(item.type || '').startsWith('artist') ? item.artistName : `${item.trackName || 'Unknown Track'} by ${item.artistName || 'Unknown Artist'}`;
        const windowLabel = item.days <= 2 ? '2 days' : `${item.days} days`;
        return `In ${item.month}, you were obsessed with ${subject} (${item.count} plays in ${windowLabel}).`;
    }

    groupObsessionsByTime(items) {
        return items.reduce((years, item) => {
            const year = String(item.year || 'Unknown');
            const month = item.monthKey || 'Unknown';
            if (!years[year]) years[year] = {};
            if (!years[year][month]) {
                years[year][month] = {
                    label: item.month || month,
                    artists: {}
                };
            }

            const artistKey = item.artistName || 'Unknown Artist';
            if (!years[year][month].artists[artistKey]) {
                years[year][month].artists[artistKey] = [];
            }
            years[year][month].artists[artistKey].push(item);
            return years;
        }, {});
    }

    escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    isSequentialObsession(a, b) {
        const dayGap = 86400;
        return a.end + dayGap >= b.start;
    }

    buildObsessionEvents(items) {
        const grouped = items.reduce((groups, item) => {
            if (!item?.artistName || !item?.monthKey) return groups;
            const key = `${item.year}|${item.monthKey}|${item.artistName}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(item);
            return groups;
        }, new Map());

        const events = [];
        grouped.forEach(groupItems => {
            const sorted = groupItems.slice().sort((a, b) => a.start - b.start || b.score - a.score);
            let cluster = [];

            const flush = () => {
                if (!cluster.length) return;
                const best = cluster.reduce((peak, item) => {
                    if (!peak) return item;
                    if (item.score !== peak.score) return item.score > peak.score ? item : peak;
                    return item.count > peak.count ? item : peak;
                }, null);
                const totalWindows = cluster.reduce((sum, item) => sum + (item.clusterCount || 1), 0);
                events.push({
                    ...best,
                    start: Math.min(...cluster.map(item => item.start)),
                    end: Math.max(...cluster.map(item => item.end)),
                    count: Math.max(...cluster.map(item => item.count)),
                    score: Math.max(...cluster.map(item => item.score || 0)),
                    eventCount: totalWindows
                });
                cluster = [];
            };

            sorted.forEach(item => {
                if (!cluster.length || cluster.some(existing => this.obsessionAnalytics.overlaps(existing, item) || this.isSequentialObsession(existing, item))) {
                    cluster.push(item);
                } else {
                    flush();
                    cluster.push(item);
                }
            });
            flush();
        });

        return events.sort((a, b) => a.start - b.start || b.score - a.score);
    }

    buildObsessionEventsByYear(items) {
        return this.buildObsessionEvents(items).reduce((years, event) => {
            const year = String(event.year || new Date(event.start * 1000).getFullYear());
            if (!years[year]) years[year] = [];
            years[year].push(event);
            return years;
        }, {});
    }

    renderObsessionTile(item) {
        const artist = this.escapeHtml(item.artistName || 'Unknown Artist');

        const text = this.escapeHtml(this.renderObsessionText(item));
        const image = this.escapeHtml(this.sanitizeImageUrl(this.artistAlbumImageCache[item.artistName] || item.imageUrl, 512));
        const collapsed = item.eventCount && item.eventCount > 1
            ? `<span class="block mt-1 text-gray-500">${item.eventCount} windows collapsed into this event.</span>`
            : '';

        return `
            <button class="obsession-tile text-left" type="button" data-artist-name="${artist}" data-track-name="${this.escapeHtml(item.trackName || '')}" data-month-key="${this.escapeHtml(item.monthKey || '')}">
                <img src="${image}" alt="${artist}" loading="lazy" onerror="this.style.display='none'">
                <span class="obsession-tile-overlay"></span>
                <span class="obsession-heat-pulse" aria-hidden="true"></span>
                <span class="obsession-tile-text">
                    <span class="block text-sm font-black leading-tight truncate">${artist}</span>
                    <span class="block text-xs font-semibold text-teal-200">Score: ${score}</span>
                </span>
                <span class="obsession-tooltip">${text}${collapsed}</span>

        `;

    getMonthSummary(month) {
        const items = Object.values(month.artists).flat();
        const best = items.reduce((peak, item) => {
            if (!peak) return item;
            if (item.count !== peak.count) return item.count > peak.count ? item : peak;
            return item.score > peak.score ? item : peak;
        }, null);
        return {
            total: items.length,
            artists: Object.keys(month.artists).length,
            best
        };
    }

    getHeatColor(count, maxCount) {
        if (!count) return 'rgba(15, 23, 42, 0.88)';
        const intensity = Math.max(0.18, count / Math.max(1, maxCount));
        const alpha = 0.22 + (intensity * 0.72);
        return `rgba(20, 184, 166, ${alpha.toFixed(2)})`;
    }

    renderYearHeatBar(year, months) {
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const summaries = monthNames.map((_, idx) => {
            const monthKey = `${year}-${String(idx + 1).padStart(2, '0')}`;
            return { monthKey, summary: months[monthKey] ? this.getMonthSummary(months[monthKey]) : { total: 0, artists: 0, best: null } };
        });
        const maxCount = Math.max(1, ...summaries.map(item => item.summary.total));

        return `
            <div class="obsession-heat-bar grid grid-cols-12 gap-1.5 mb-4">
                ${summaries.map((item, idx) => {
                    const best = item.summary.best;
                    const title = best
                        ? `${monthNames[idx]} ${year}: ${item.summary.total} Obsession${item.summary.total === 1 ? '' : 's'} found (Best: ${best.artistName} - ${best.count} plays)`
                        : `${monthNames[idx]} ${year}: 0 Obsessions found`;
                    const safeTitle = this.escapeHtml(title);
                    return `<button class="month-heat-block" style="background:${this.getHeatColor(item.summary.total, maxCount)}" title="${safeTitle}" data-month-target="${this.escapeHtml(item.monthKey)}" aria-label="${safeTitle}"></button>`;
                }).join('')}
            </div>
        `;
    }

    bindObsessionArchiveControls() {
        const archive = document.getElementById('heavyRotationArchive');
        const toggleAll = document.getElementById('toggleAllObsessions');
        if (!archive) return;

        archive.addEventListener('click', event => {
            const heatBlock = event.target.closest('.month-heat-block');
            if (heatBlock && archive.contains(heatBlock)) {
                event.preventDefault();
                const section = heatBlock.closest('.obsession-year-section');
                const rail = section?.querySelector('.obsession-year-rail');
                const monthKey = heatBlock.dataset.monthTarget;
                if (!section || !rail || !monthKey) return;

                section.querySelectorAll('.month-heat-block.active').forEach(block => block.classList.remove('active'));
                heatBlock.classList.add('active');

                const tile = rail.querySelector(`.obsession-tile[data-month-key="${monthKey}"]`);
                if (!tile) {
                    heatBlock.classList.remove('shake');
                    rail.classList.remove('empty-flash');
                    rail.dataset.emptyLabel = `${heatBlock.getAttribute('aria-label') || monthKey}: no obsession events`;
                    requestAnimationFrame(() => {
                        heatBlock.classList.add('shake');
                        rail.classList.add('empty-flash');
                    });
                    setTimeout(() => {
                        heatBlock.classList.remove('shake');
                        rail.classList.remove('empty-flash');
                    }, 950);
                    return;
                }

                archive.querySelectorAll('.obsession-tile.open').forEach(item => item.classList.remove('open'));
                tile.classList.add('open');
                const railRect = rail.getBoundingClientRect();
                const tileRect = tile.getBoundingClientRect();
                const targetLeft = Math.max(0, rail.scrollLeft + tileRect.left - railRect.left - 2);
                rail.scrollTo({ left: targetLeft, behavior: 'smooth' });
                return;
            }

            const tile = event.target.closest('.obsession-tile');
            if (tile && archive.contains(tile)) {
                const isOpen = tile.classList.contains('open');
                archive.querySelectorAll('.obsession-tile.open').forEach(item => item.classList.remove('open'));
                tile.classList.toggle('open', !isOpen);
                return;
            }

        });

        toggleAll?.addEventListener('click', () => {
            const tiles = [...archive.querySelectorAll('.obsession-tile')];
            const shouldOpen = tiles.some(tile => !tile.classList.contains('open'));
            tiles.forEach(tile => tile.classList.toggle('open', shouldOpen));
            toggleAll.textContent = shouldOpen ? 'Hide Details' : 'Show Details';
        });

    }

    async hydrateObsessionTileImages(renderToken) {
        const archive = document.getElementById('heavyRotationArchive');
        if (!archive) return;
        const tiles = [...archive.querySelectorAll('.obsession-tile')];
        const uniqueArtists = [...new Set(tiles.map(tile => tile.dataset.artistName).filter(Boolean))];
        const trackKeys = [...new Set(tiles
            .filter(tile => tile.dataset.artistName && tile.dataset.trackName)
            .map(tile => `track:${tile.dataset.artistName}:${tile.dataset.trackName}`))];
        const artistImages = new Map();
        const trackImages = new Map();
        let trackArtwork = new Map();

        try {
            trackArtwork = await this.cache.getArtworkMany(trackKeys);
        } catch (err) {
            trackArtwork = new Map();
        }

        await Promise.all([...trackArtwork.entries()].map(async ([key, artwork]) => {
            const imageUrl = await this.getArtworkDisplayUrl(artwork, 512);
            if (imageUrl) trackImages.set(key, imageUrl);
        }));

        await Promise.all(uniqueArtists.map(async artistName => {
            const imageUrl = await this.getArtistAlbumImage(artistName);
            if (imageUrl) artistImages.set(artistName, imageUrl);
        }));

        if (renderToken !== this.obsessionRenderToken || !document.getElementById('heavyRotationArchive')) return;

        tiles.forEach(tile => {
            if (!archive.contains(tile)) return;
            const image = tile.querySelector('img');
            const trackKey = tile.dataset.artistName && tile.dataset.trackName
                ? `track:${tile.dataset.artistName}:${tile.dataset.trackName}`
                : '';
            const imageUrl = trackImages.get(trackKey) || artistImages.get(tile.dataset.artistName);

            if (imageUrl && image) {
                image.style.display = '';
                image.src = this.sanitizeImageUrl(imageUrl, 512);
            }
        });
    }

    renderCinematicTimeline(activeItem = null) {
        const years = Array.from({ length: 15 }, (_, idx) => 2012 + idx);
        const months = Array.from({ length: 12 }, (_, idx) => idx + 1);
        const activeYear = activeItem?.year;
        const activeMonth = activeItem ? new Date(activeItem.start * 1000).getMonth() + 1 : null;

        return `
            <div class="cinematic-grid">
                ${years.map(year => `
                    <div class="cinematic-year">
                        <div class="cinematic-year-label">${year}</div>
                        ${months.map(month => `
                            <div class="cinematic-month-cell ${year === activeYear && month === activeMonth ? 'active' : ''}"></div>
                        `).join('')}
                    </div>
                `).join('')}
            </div>
        `;
    }

    getCinematicSnippet(item) {
        const month = new Date(item.start * 1000).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        return `${month}: ${item.count} plays in ${item.days} days (Best ${item.artistName} Peak)`;
    }

    showCinematicLoader(total = 0) {
        const stage = document.getElementById('cinematicStage');
        if (!stage) return;

        stage.innerHTML = `
            ${this.renderCinematicTimeline()}
            <div class="cinematic-loader">
                <div class="cinematic-loader-card">
                    <p class="text-lg font-bold">Loading Assets...</p>
                    <p id="cinematicLoaderText" class="text-gray-400 text-xs mt-2">Preparing ${total} artist image${total === 1 ? '' : 's'}</p>
                    <div class="cinematic-loader-track">
                        <div id="cinematicLoaderBar" class="cinematic-loader-bar"></div>
                    </div>
                </div>
            </div>
        `;
    }

    updateCinematicLoader(done, total) {
        const percent = total ? Math.round((done / total) * 100) : 100;
        const bar = document.getElementById('cinematicLoaderBar');
        const text = document.getElementById('cinematicLoaderText');
        if (bar) bar.style.width = `${percent}%`;
        if (text) text.textContent = `Loaded ${done} of ${total} artist image${total === 1 ? '' : 's'}`;
    }

    loadImageElement(src) {
        return new Promise(resolve => {
            if (!src) {
                resolve('');
                return;
            }
            const image = new Image();
            image.onload = async () => {
                if (image.decode) {
                    try {
                        await image.decode();
                    } catch (err) {}
                }
                resolve(src);
            };
            image.onerror = () => resolve(src);
            image.src = src;
        });
    }

    async preloadCinematicAssets(items) {
        const uniqueArtists = [...new Set(items.map(item => item.artistName).filter(Boolean))];
        const imageMap = new Map();
        let loaded = 0;
        this.updateCinematicLoader(loaded, uniqueArtists.length);

        const artworkKeys = uniqueArtists.map(artistName => `artist-album:${artistName}`);
        let cachedArtwork = new Map();
        try {
            cachedArtwork = await this.cache.getArtworkMany(artworkKeys);
        } catch (err) {
            cachedArtwork = new Map();
        }

        await Promise.all(uniqueArtists.map(async artistName => {
            try {
                const artworkKey = `artist-album:${artistName}`;
                const localArtwork = cachedArtwork.get(artworkKey);
                let imageUrl = null;

                if (localArtwork) {
                    imageUrl = await this.getArtworkDisplayUrl(localArtwork, 512);
                    this.artistAlbumImageCache[artistName] = imageUrl;
                } else {
                    imageUrl = await this.getArtistAlbumImage(artistName);
                }

                const decodedSrc = await this.loadImageElement(this.sanitizeImageUrl(imageUrl, 512));
                imageMap.set(artistName, decodedSrc);
            } catch (err) {
                imageMap.set(artistName, this.getImagePlaceholder(512));
            } finally {
                loaded++;
                this.updateCinematicLoader(loaded, uniqueArtists.length);
            }
        }));

        return items.map(item => ({
            ...item,
            cinematicImage: imageMap.get(item.artistName) || this.sanitizeImageUrl(item.imageUrl, 512)
        }));
    }

    buildCinematicSequence(items) {
        const bestByArtistYear = new Map();

        items.forEach(item => {
            if (!item?.artistName || !item?.start) return;
            const year = item.year || new Date(item.start * 1000).getFullYear();
            const key = `${year}|${item.artistName}`;
            const current = bestByArtistYear.get(key);
            const itemScore = item.score || 0;
            const currentScore = current?.score || 0;

            if (!current || itemScore > currentScore || (itemScore === currentScore && item.count > current.count)) {
                bestByArtistYear.set(key, { ...item, year });
            }
        });

        return [...bestByArtistYear.values()].sort((a, b) => a.start - b.start);
    }

    async renderCinematicFrame(item) {
        const stage = document.getElementById('cinematicStage');
        if (!stage || !item) return;

        const image = this.sanitizeImageUrl(item.cinematicImage || item.imageUrl, 512);
        const artistName = this.escapeHtml(item.artistName || 'Unknown Artist');
        const snippet = this.escapeHtml(this.getCinematicSnippet(item));
        stage.innerHTML = `
            ${this.renderCinematicTimeline(item)}
            <div class="heartbeat">
                <span class="heartbeat-wave"></span>
                <span class="heartbeat-wave"></span>
                <span class="heartbeat-wave"></span>
                <span class="heartbeat-point"></span>
                <span class="heartbeat-point"></span>
            </div>
            <button id="cinematicExitBtn" class="absolute top-4 right-4 z-10 px-4 py-2 rounded bg-gray-900/70 hover:bg-gray-800 border border-gray-700 text-xs font-semibold transition">Exit</button>
            <div id="cinematicCard" class="cinematic-card">
                <img src="${image}" alt="${artistName}" onerror="this.style.display='none'">
                <div class="cinematic-card-body">
                    <div class="cinematic-artist">${artistName}</div>
                    <div class="cinematic-snippet">${snippet}</div>
                </div>
            </div>
        `;
        document.getElementById('cinematicExitBtn')?.addEventListener('click', () => this.stopCinematicPlayback());
        requestAnimationFrame(() => document.getElementById('cinematicCard')?.classList.add('active'));
    }

    playNextCinematicFrame() {
        if (!this.cinematicItems.length) return;
        const sessionId = this.cinematicSessionId;
        const card = document.getElementById('cinematicCard');
        card?.classList.add('exit');

        clearTimeout(this.cinematicFrameTimeout);
        this.cinematicFrameTimeout = setTimeout(() => {
            if (sessionId !== this.cinematicSessionId || !document.body.classList.contains('cinematic-mode')) return;
            const item = this.cinematicItems[this.cinematicIndex % this.cinematicItems.length];
            this.cinematicIndex++;
            this.renderCinematicFrame(item);
        }, card ? 260 : 0);
    }

    async startCinematicPlayback(items) {
        const sessionId = ++this.cinematicSessionId;
        const sequenceItems = this.buildCinematicSequence(items);
        if (!sequenceItems.length) return;

        clearInterval(this.cinematicTimer);
        clearTimeout(this.cinematicFrameTimeout);
        document.body.classList.add('cinematic-mode');
        document.getElementById('obsessionOverview')?.classList.add('hidden');
        document.getElementById('heavyRotationArchive')?.classList.add('hidden');
        document.getElementById('cinematicStage')?.classList.remove('hidden');
        this.showCinematicLoader(new Set(sequenceItems.map(item => item.artistName)).size);
        this.cinematicItems = await this.preloadCinematicAssets(sequenceItems);
        if (sessionId !== this.cinematicSessionId || !document.body.classList.contains('cinematic-mode')) return;
        this.cinematicIndex = 0;
        this.playNextCinematicFrame();
        this.cinematicTimer = setInterval(() => this.playNextCinematicFrame(), 3600);
    }

    resetCinematicPlayButton() {
        const playBtn = document.getElementById('cinematicPlayBtn');
        if (!playBtn) return;
        playBtn.disabled = false;
        playBtn.textContent = 'Play Cinematic';
    }

    stopCinematicPlayback() {
        this.cinematicSessionId++;
        clearInterval(this.cinematicTimer);
        clearTimeout(this.cinematicFrameTimeout);
        this.cinematicTimer = null;
        this.cinematicFrameTimeout = null;
        this.cinematicItems = [];
        document.body.classList.remove('cinematic-mode');
        document.getElementById('obsessionOverview')?.classList.remove('hidden');
        document.getElementById('heavyRotationArchive')?.classList.remove('hidden');
        document.getElementById('cinematicStage')?.classList.add('hidden');
        const stage = document.getElementById('cinematicStage');
        if (stage) stage.innerHTML = '';
        this.resetCinematicPlayButton();
    }

    async renderObsessions() {
        const renderToken = ++this.obsessionRenderToken;
        const container = document.getElementById('obsessionsContent');
        container.innerHTML = '<div class="text-center py-8 text-gray-400">Analyzing listening obsessions...</div>';

        try {
            this.updatePageProgress(34, 'Loading cached scrobbles');
            const result = await this.obsessionAnalytics.compute((percent, label) => {
                if (renderToken !== this.obsessionRenderToken) return;
                this.updatePageProgress(34 + (percent * 0.58), label);
                container.innerHTML = `<div class="text-center py-8 text-gray-400">${label} ${Math.round(percent)}%</div>`;
            });
            if (renderToken !== this.obsessionRenderToken) return;

            const archiveByYear = this.groupObsessionsByTime(result.heavyRotation);
            const eventByYear = this.buildObsessionEventsByYear(result.heavyRotation);
            const years = Object.keys(archiveByYear).sort((a, b) => b - a);

            container.innerHTML = `
                <div id="obsessionOverview" class="space-y-8">
                    <section>
                        <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
                            <div>
                                <h2 class="text-2xl font-bold">Listening Obsessions</h2>
                                <p class="text-gray-400 text-sm">${result.totalScrobbles.toLocaleString()} cached scrobbles analyzed</p>
                                <p class="text-gray-500 text-xs mt-1">Thresholds scale by each year&apos;s listening volume, with lower-volume years allowed to surface smaller historical peaks.</p>
                            </div>
                            <p class="text-gray-500 text-xs">Computed ${new Date(result.computedAt).toLocaleString()}</p>
                        </div>
                    </section>

                    <section>
                        <h3 class="text-xl font-bold mb-4">Top Streaks</h3>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                            ${result.topStreaks.length ? result.topStreaks.map(streak => this.renderTopStreakCard(streak)).join('') : '<div class="text-gray-400 bg-gray-800 rounded-lg p-4">No repeated track streaks found yet.</div>'}
                        </div>
                    </section>

                    <section>
                        <div class="flex items-center justify-between gap-3 mb-4">
                            <h3 class="text-xl font-bold">Heavy Rotation Archive</h3>
                            <div class="flex gap-2">
                                <button id="cinematicPlayBtn" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 rounded text-xs font-bold transition">Play Cinematic</button>
                                <button id="toggleAllObsessions" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded text-xs font-semibold transition">Show Details</button>
                            </div>
                        </div>
                        <div id="heavyRotationArchive" class="space-y-5">
                            ${years.length ? years.map(year => `
                                <div class="obsession-year-section bg-gray-800/40 border border-gray-800 rounded-lg p-4 min-w-0 max-w-full overflow-hidden" data-year="${year}">
                                    <div class="flex items-center justify-between gap-3 mb-4">
                                        <h4 class="text-lg font-bold text-gray-200">${year}</h4>
                                        <span class="text-xs text-gray-500">${(eventByYear[year] || []).length} Obsession Event${(eventByYear[year] || []).length === 1 ? '' : 's'}</span>
                                    </div>
                                    ${this.renderYearHeatBar(year, archiveByYear[year])}
                                    <div class="obsession-year-rail" data-year="${year}">
                                        ${(eventByYear[year] || []).slice().sort((a, b) => a.start - b.start || b.score - a.score).map(item => this.renderObsessionTile(item)).join('')}
                                    </div>
                                </div>
                            `).join('') : '<div class="text-gray-400 bg-gray-800 rounded-lg p-4">No heavy rotation windows crossed the current thresholds.</div>'}
                        </div>
                    </section>
                </div>
                <div id="cinematicStage" class="cinematic-stage hidden"></div>
            `;
            this.bindObsessionArchiveControls();
            this.hydrateObsessionTileImages(renderToken).catch(() => {});
            document.getElementById('cinematicPlayBtn')?.addEventListener('click', async (event) => {
                event.currentTarget.disabled = true;
                event.currentTarget.textContent = 'Loading...';
                try {
                    await this.startCinematicPlayback(result.heavyRotation);
                } finally {
                    this.resetCinematicPlayButton();
                }
            });
            this.updatePageProgress(94, 'Obsessions ready');
        } catch (err) {
            container.innerHTML = `<div class="text-red-500">Error analyzing obsessions: ${err.message}</div>`;
        }
    }

    bindCacheSettings() {
        const exportBtn = document.getElementById('exportCacheBtn');
        const importBtn = document.getElementById('importCacheBtn');
        const exportImageBtn = document.getElementById('exportImageCacheBtn');
        const importImageBtn = document.getElementById('importImageCacheBtn');
        const importInput = document.getElementById('importCacheInput');
        const importImageInput = document.getElementById('importImageCacheInput');
        const status = document.getElementById('cacheSettingsStatus');
        const progressPanel = document.getElementById('cacheProgressPanel');
        const progressBar = document.getElementById('cacheProgressBar');
        const progressPercent = document.getElementById('cacheProgressPercent');

        const showCacheProgress = (label) => {
            progressPanel?.classList.remove('hidden');
            setCacheProgress(0, label);
        };
        const hideCacheProgress = () => {
            setTimeout(() => {
                progressPanel?.classList.add('hidden');
                if (progressBar) progressBar.style.width = '0%';
                if (progressPercent) progressPercent.textContent = '0%';
            }, 650);
        };
        const setCacheProgress = (percent, label = null) => {
            const value = Math.max(0, Math.min(100, Math.round(percent)));
            if (progressBar) progressBar.style.width = `${value}%`;
            if (progressPercent) progressPercent.textContent = `${value}%`;
            if (status && label) status.textContent = label;
        };

        exportBtn?.addEventListener('click', async () => {
            try {
                exportBtn.disabled = true;
                exportBtn.textContent = 'Exporting...';
                showCacheProgress('Preparing cache export');
                await this.exportCache((percent, label) => setCacheProgress(percent, label));
                setCacheProgress(100, 'Cache exported successfully');
                hideCacheProgress();
            } catch (err) {
                setCacheProgress(0, `Export failed: ${err.message}`);
                hideCacheProgress();
            } finally {
                exportBtn.disabled = false;
                exportBtn.textContent = 'Export Cache';
            }
        });

        importBtn?.addEventListener('click', () => importInput?.click());
        importInput?.addEventListener('change', async () => {
            const file = importInput.files?.[0];
            if (!file) return;

            try {
                importBtn.disabled = true;
                importBtn.textContent = 'Importing...';
                showCacheProgress('Preparing cache import');
                await this.importCache(file, (percent, label) => setCacheProgress(percent, label));
                const cachedCount = (await this.cache.getAll('scrobbles')).length;
                setCacheProgress(100, `Imported cache. ${cachedCount.toLocaleString()} scrobbles stored locally`);
                hideCacheProgress();
                if (document.getElementById('race') && !document.getElementById('race').classList.contains('hidden')) {
                    await this.renderBarChartRace();
                }
            } catch (err) {
                setCacheProgress(0, `Import failed: ${err.message}`);
                hideCacheProgress();
            } finally {
                importBtn.disabled = false;
                importBtn.textContent = 'Import Cache';
                importInput.value = '';
            }
        });

        exportImageBtn?.addEventListener('click', async () => {
            try {
                exportImageBtn.disabled = true;
                exportImageBtn.textContent = 'Exporting Images...';
                showCacheProgress('Preparing image export');
                await this.exportImageCache((percent, label) => setCacheProgress(percent, label));
                setCacheProgress(100, 'Image cache exported successfully');
                hideCacheProgress();
            } catch (err) {
                setCacheProgress(0, `Image export failed: ${err.message}`);
                hideCacheProgress();
            } finally {
                exportImageBtn.disabled = false;
                exportImageBtn.textContent = 'Export Image Cache';
            }
        });

        importImageBtn?.addEventListener('click', () => importImageInput?.click());
        importImageInput?.addEventListener('change', async () => {
            const file = importImageInput.files?.[0];
            if (!file) return;

            try {
                importImageBtn.disabled = true;
                importImageBtn.textContent = 'Importing Images...';
                showCacheProgress('Preparing image import');
                await this.importImageCache(file, (percent, label) => setCacheProgress(percent, label));
                const imageCount = (await this.cache.getAll('artwork')).length;
                setCacheProgress(100, `Imported image cache. ${imageCount.toLocaleString()} image records stored locally`);
                hideCacheProgress();
                await this.renderHistory();
            } catch (err) {
                setCacheProgress(0, `Image import failed: ${err.message}`);
                hideCacheProgress();
            } finally {
                importImageBtn.disabled = false;
                importImageBtn.textContent = 'Import Image Cache';
                importImageInput.value = '';
            }
        });
    }

    async renderBarChartRace() {
        const container = document.getElementById('raceContent');
        container.innerHTML = '<div class="text-center py-8">Loading local scrobble cache...</div>';

        try {
            this.updatePageProgress(26, 'Opening IndexedDB');
            await this.cache.open();
            let allTracks = await this.cache.getTracks();
            if (!allTracks || allTracks.length === 0) {
                container.innerHTML = '<div class="text-center py-8">Syncing local scrobble cache...</div>';
                allTracks = await this.loadCachedScrobbles(true, progress => {
                    this.updatePageProgress(Math.min(70, 28 + progress.page), 'Syncing scrobbles');
                    container.innerHTML = `<div class="text-center py-8">Syncing local scrobble cache... ${progress.loaded.toLocaleString()} tracks loaded</div>`;
                });
            } else {
                this.cachedTracks = allTracks;
                this.cacheStatus = `${allTracks.length.toLocaleString()} cached scrobbles`;
                this.loadCachedScrobbles(true).then(() => {
                    const status = document.getElementById('raceCacheStatus');
                    if (status) status.textContent = this.cacheStatus;
                }).catch(err => console.warn('Incremental scrobble sync failed:', err));
            }
            this.updatePageProgress(48, 'Building year tabs');
            const years = await this.getCachedYears();

            if (!allTracks || allTracks.length === 0) {
                container.innerHTML = '<div class="text-yellow-500">No scrobble history available</div>';
                return;
            }

            if (this.selectedRaceYear !== 'all' && !years.includes(parseInt(this.selectedRaceYear))) {
                this.selectedRaceYear = 'all';
            }

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div class="flex flex-wrap gap-2" id="raceYearTabs">
                            <button class="race-year-tab px-4 py-2 rounded text-sm font-semibold transition ${this.selectedRaceYear === 'all' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}" data-year="all">All-Time</button>
                            ${years.map(year => `
                                <button class="race-year-tab px-4 py-2 rounded text-sm font-semibold transition ${String(this.selectedRaceYear) === String(year) ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}" data-year="${year}">${year}</button>
                            `).join('')}
                        </div>
                        <div id="raceCacheStatus" class="text-xs text-gray-400">${this.cacheStatus}</div>
                    </div>
                    <div id="raceYearSpinner" class="race-spinner">
                        <span class="race-spinner-ring"></span>
                        <span>Preparing timeline...</span>
                    </div>
                    <div id="chart"></div>
                </div>
            `;

            this.bindRaceYearTabs(allTracks);
            this.updatePageProgress(62, 'Parsing race data');
            await this.renderRaceChart(allTracks, this.selectedRaceYear);
            this.startHistoricalBackfill().then(async changed => {
                if (changed && document.getElementById('raceContent') && !document.getElementById('race').classList.contains('hidden')) {
                    await this.renderBarChartRace();
                }
            });
        } catch (err) {
            console.error('Bar chart error:', err);
            container.innerHTML = `<div class="text-red-500">Error: ${err.message}</div>`;
        }
    }

    bindRaceYearTabs(allTracks) {
        document.querySelectorAll('.race-year-tab').forEach(tab => {
            tab.addEventListener('click', async () => {
                this.setRaceYearSpinner(true);
                this.selectedRaceYear = tab.dataset.year;
                document.querySelectorAll('.race-year-tab').forEach(btn => {
                    btn.classList.remove('bg-blue-600', 'text-white');
                    btn.classList.add('bg-gray-800', 'text-gray-300');
                });
                tab.classList.add('bg-blue-600', 'text-white');
                tab.classList.remove('bg-gray-800', 'text-gray-300');
                try {
                    await this.renderRaceChart(allTracks, this.selectedRaceYear);
                } finally {
                    this.setRaceYearSpinner(false);
                }
            });
        });
    }

    setRaceYearSpinner(isVisible) {
        const spinner = document.getElementById('raceYearSpinner');
        spinner?.classList.toggle('active', isVisible);
    }

    async renderRaceChart(allTracks, year) {
        const chart = document.getElementById('chart');
        if (!chart) return;

        if (this.barChartRace) {
            this.barChartRace.pause();
            this.barChartRace = null;
        }
        chart.innerHTML = '';
        this.revokeArtworkObjectUrls();

        const scopedTracks = this.filterTracksByYear(allTracks, year);
        if (scopedTracks.length === 0) {
            chart.innerHTML = '<div class="text-yellow-500 bg-gray-800 rounded-lg p-4">No cached scrobbles for this period</div>';
            return;
        }

        chart.innerHTML = '<div class="text-center py-8 text-gray-400">Preparing cached artwork...</div>';
        let hydratedTracks = scopedTracks;
        try {
            this.updatePageProgress(70, 'Preparing artwork');
            hydratedTracks = await this.hydrateRaceArtwork(scopedTracks);
        } catch (err) {
            console.warn('Artwork cache hydration skipped:', err);
        }
        this.updatePageProgress(82, 'Building timeline');
        const processor = new DataProcessor(this.apiClient);
        const temporalData = processor.buildTemporalData(hydratedTracks);
        const validData = temporalData.filter(frame => frame.artists && frame.artists.length > 0);

        if (validData.length === 0) {
            chart.innerHTML = '<div class="text-yellow-500 bg-gray-800 rounded-lg p-4">No artist data available for this period</div>';
            return;
        }

        chart.innerHTML = '';
        this.barChartRace = new BarChartRace('chart', validData);
        this.barChartRace.render();
        this.updatePageProgress(94, 'Race ready');
    }
}

    }

    render() {

            <div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 flex items-center justify-center p-4">
                <div class="bg-gray-800 rounded-lg shadow-2xl max-w-md w-full p-8 border border-gray-700">
                    <h1 class="text-3xl font-bold text-white mb-2">Last.fm Dashboard</h1>
                    <p class="text-gray-400 mb-6">Configure your Last.fm credentials to get started</p>

                    <div id="errorMsg" class="hidden bg-red-900 border border-red-600 text-red-100 px-4 py-3 rounded mb-4"></div>

                    <form id="setupForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-300 mb-2">Last.fm API Key</label>
                            <input type="text" id="apiKey" placeholder="Your API Key" class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                            <p class="text-xs text-gray-500 mt-1"><a href="https://www.last.fm/api/account/create" target="_blank" class="text-blue-400 hover:underline">Get your API key here</a></p>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-300 mb-2">Last.fm Username</label>
                            <input type="text" id="username" placeholder="Your Last.fm username" class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-6 transition">Save & Connect</button>
                    </form>
                </div>
            </div>
        `;

        document.getElementById('setupForm').addEventListener('submit', (e) => this.handleSubmit(e));
    }

    async handleSubmit(e) {
        e.preventDefault();
        const apiKey = document.getElementById('apiKey').value.trim();
        const username = document.getElementById('username').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (!apiKey || !username) {
            errorMsg.textContent = 'Please fill in all fields';
            errorMsg.classList.remove('hidden');
            return;
        }

        errorMsg.classList.add('hidden');
        errorMsg.textContent = '';

        try {
            const client = new APIClient(apiKey, username);
            await client.getUserInfo();

            this.authManager.save(apiKey, username);
            window.location.reload();
        } catch (err) {
            errorMsg.textContent = err.message;
            errorMsg.classList.remove('hidden');
        }
    }
}

// ============================================
// 7. App Initialization
// ============================================
class App {
    constructor() {
        this.authManager = new AuthManager();
        this.progress = new ProgressUI('globalProgress', 'globalProgressBar');
    }

    async init() {
        this.progress.start('Starting');
        try {
            if (!this.authManager.isAuthenticated()) {
                this.progress.set(60, 'Loading setup');
                const modal = new SetupModal(this.authManager);
                modal.render();
                this.progress.done('Ready');
            } else {
                this.progress.set(14, 'Loading credentials');
                const auth = this.authManager.load();
                const apiClient = new APIClient(auth.apiKey, auth.username);
                const dashboard = new Dashboard(apiClient, this.authManager);
                dashboard.setPageProgressHandler((action, percent, label) => {
                    if (action === 'start') this.progress.start(label);
                    if (action === 'set') this.progress.set(percent, label);
                    if (action === 'done') this.progress.done(label);
                });
                await dashboard.renderDashboard((percent, label) => this.progress.set(percent, label));
                this.progress.done('Ready');
            }
        } catch (err) {
            this.progress.done('Error');
            throw err;
        }
    }
}

const app = new App();
app.init();
</script>
