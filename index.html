<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last.fm Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="jszip.min.js"></script>
    <style>
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.18) transparent;
        }

        *:hover {
            scrollbar-color: rgba(148, 163, 184, 0.55) transparent;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.14);
            border: 2px solid transparent;
            border-radius: 999px;
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.58);
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        .global-progress {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.72);
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .global-progress.active {
            opacity: 1;
        }

        .global-progress-bar {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #2563EB, #14B8A6);
            box-shadow: 0 0 18px rgba(20, 184, 166, 0.42);
            transition: width 240ms ease;
        }

        .cache-progress-track {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .cache-progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #2563EB, #14B8A6);
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.32);
            transition: width 220ms ease;
        }

        .race-spinner {
            display: none;
            align-items: center;
            gap: 10px;
            color: #94A3B8;
            font-size: 12px;
        }

        .race-spinner.active {
            display: flex;
        }

        .race-spinner-ring {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(148, 163, 184, 0.18);
            border-top-color: #14B8A6;
            border-radius: 999px;
            box-shadow: 0 0 16px rgba(20, 184, 166, 0.2);
            animation: raceSpin 780ms linear infinite;
        }

        @keyframes raceSpin {
            to { transform: rotate(360deg); }
        }

        .obsession-month-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 260ms ease, opacity 220ms ease;
        }

        .obsession-month.open .obsession-month-panel {
            max-height: 1400px;
            opacity: 1;
        }

        .obsession-month-arrow {
            transition: transform 180ms ease;
        }

        .obsession-month.open .obsession-month-arrow {
            transform: rotate(180deg);
        }

        .month-heat-block {
            min-width: 18px;
            height: 14px;
            border-radius: 4px;
            border: 1px solid rgba(148, 163, 184, 0.12);
            background: rgba(15, 23, 42, 0.82);
            transition: transform 150ms ease, box-shadow 150ms ease, opacity 150ms ease;
        }

        .month-heat-block:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 16px rgba(20, 184, 166, 0.24);
        }

        .month-heat-block.active {
            border-color: rgba(94, 234, 212, 0.72);
            box-shadow: 0 0 18px rgba(20, 184, 166, 0.42);
            animation: heatBlockPulse 1.1s ease-in-out infinite alternate;
        }

        .month-heat-block.shake {
            animation: heatBlockShake 260ms ease;
        }

        @keyframes heatBlockPulse {
            from { transform: scaleY(0.9); opacity: 0.72; }
            to { transform: scaleY(1.12); opacity: 1; }
        }

        @keyframes heatBlockShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .obsession-year-rail {
            position: relative;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 12px;
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            padding: 2px 2px 18px;
            scroll-snap-type: x proximity;
            overscroll-behavior-x: contain;
            overscroll-behavior-y: none;
            scrollbar-width: thin;
            scrollbar-color: rgba(94, 234, 212, 0.34) transparent;
        }

        .obsession-year-rail::-webkit-scrollbar {
            height: 6px;
        }

        .obsession-year-rail::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.54);
            border-radius: 999px;
        }

        .obsession-year-rail::-webkit-scrollbar-thumb {
            background: rgba(94, 234, 212, 0.38);
            border: 1px solid rgba(15, 23, 42, 0.78);
            border-radius: 999px;
            background-clip: padding-box;
        }

        .obsession-year-rail::-webkit-scrollbar-thumb:hover {
            background: rgba(94, 234, 212, 0.68);
            border: 1px solid rgba(15, 23, 42, 0.78);
            background-clip: padding-box;
        }

        .obsession-year-rail.empty-flash::after {
            content: attr(data-empty-label);
            position: sticky;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(100%, 340px);
            min-height: 42px;
            padding: 10px 14px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.92);
            color: #94A3B8;
            font-size: 12px;
            box-shadow: 0 0 18px rgba(20, 184, 166, 0.14);
            animation: emptyRailFlash 900ms ease;
        }

        @keyframes emptyRailFlash {
            0% { opacity: 0; transform: translateY(6px); }
            18%, 76% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(6px); }
        }

        .obsession-tile {
            position: relative;
            flex: 0 0 auto;
            flex-shrink: 0;
            width: clamp(142px, 18vw, 170px);
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.88);
            scroll-snap-align: start;
            isolation: isolate;
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .obsession-tile:hover,
        .obsession-tile:focus-within,
        .obsession-tile.open {
            transform: translateY(-2px);
            border-color: rgba(94, 234, 212, 0.58);
            box-shadow: 0 18px 38px rgba(0, 0, 0, 0.32), 0 0 24px rgba(20, 184, 166, 0.24);
            z-index: 4;
        }

        .obsession-tile img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(1.05) contrast(1.04);
            transform: scale(1.02);
            transition: transform 220ms ease, filter 220ms ease;
        }

        .obsession-tile:hover img,
        .obsession-tile.open img {
            transform: scale(1.08);
            filter: saturate(1.16) contrast(1.08);
        }

        .obsession-tile-overlay {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 72% 22%, rgba(20, 184, 166, 0.28), transparent 28%),
                linear-gradient(180deg, rgba(2, 6, 23, 0.12), rgba(2, 6, 23, 0.88));
            z-index: 1;
        }

        .obsession-heat-pulse {
            position: absolute;
            right: 12px;
            top: 12px;
            width: 34px;
            height: 34px;
            border: 1px solid rgba(94, 234, 212, 0.76);
            border-radius: 999px;
            z-index: 2;
            box-shadow: 0 0 20px rgba(20, 184, 166, 0.42), inset 0 0 18px rgba(20, 184, 166, 0.2);
            animation: tilePulse 1.65s ease-in-out infinite;
        }

        .obsession-heat-pulse::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: inherit;
            background: rgba(103, 232, 249, 0.78);
            box-shadow: 0 0 16px rgba(103, 232, 249, 0.86);
        }

        @keyframes tilePulse {
            0%, 100% { transform: scale(0.88); opacity: 0.58; }
            50% { transform: scale(1.14); opacity: 1; }
        }

        .obsession-tile-text {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;
            z-index: 2;
        }

        .obsession-tooltip {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 10px;
            z-index: 5;
            padding: 10px;
            border-radius: 8px;
            background: rgba(2, 6, 23, 0.94);
            border: 1px solid rgba(94, 234, 212, 0.26);
            color: #CBD5E1;
            font-size: 11px;
            line-height: 1.35;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity 160ms ease, transform 160ms ease;
        }

        .obsession-tile:hover .obsession-tooltip,
        .obsession-tile:focus-within .obsession-tooltip,
        .obsession-tile.open .obsession-tooltip {
            opacity: 1;
            transform: translateY(0);
        }

        body.cinematic-mode header,
        body.cinematic-mode .border-b.border-gray-700 {
            display: none;
        }

        body.cinematic-mode .tab-content:not(#obsessions) {
            display: none !important;
        }

        body.cinematic-mode #obsessions {
            padding: 0;
        }

        #app,
        #obsessions,
        #obsessionsContent,
        #obsessionOverview,
        #heavyRotationArchive {
            max-width: 100vw;
            box-sizing: border-box;
        }

        #obsessionsContent,
        #obsessionOverview,
        #heavyRotationArchive {
            overflow-x: hidden;
        }

        #obsessions {
            height: 100%;
            max-height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .obsession-heat-bar {
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            box-sizing: border-box;
            overscroll-behavior-x: contain;
        }

        .obsession-year-section {
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

        .cinematic-stage {
            position: relative;
            min-height: calc(100vh - 1px);
            overflow: hidden;
            border: 1px solid rgba(20, 184, 166, 0.16);
            border-radius: 8px;
            background:
                radial-gradient(circle at center, rgba(20, 184, 166, 0.18), transparent 34%),
                linear-gradient(180deg, rgba(2, 6, 23, 0.92), rgba(15, 23, 42, 0.98));
            isolation: isolate;
        }

        .cinematic-grid {
            position: absolute;
            inset: 7% 5%;
            display: grid;
            grid-template-rows: repeat(15, 1fr);
            gap: 7px;
            opacity: 0.32;
            filter: blur(0.2px);
        }

        .cinematic-year {
            display: grid;
            grid-template-columns: 56px repeat(12, 1fr);
            gap: 4px;
            align-items: center;
        }

        .cinematic-year-label {
            color: rgba(203, 213, 225, 0.34);
            font-size: 11px;
            font-weight: 800;
        }

        .cinematic-month-cell {
            height: 10px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.08);
        }

        .cinematic-month-cell.active {
            background: rgba(20, 184, 166, 0.82);
            box-shadow: 0 0 26px rgba(20, 184, 166, 0.78);
            animation: monthPulse 900ms ease-in-out infinite alternate;
        }

        @keyframes monthPulse {
            from { transform: scaleX(0.92); opacity: 0.72; }
            to { transform: scaleX(1.08); opacity: 1; }
        }

        .heartbeat {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.9;
        }

        .heartbeat-wave {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(72vw, 860px);
            height: min(42vw, 420px);
            border: 2px solid rgba(20, 184, 166, 0.35);
            border-radius: 46% 54% 52% 48%;
            transform: translate(-50%, -50%);
            animation: heartbeatPulse 1.35s ease-in-out infinite;
            box-shadow: 0 0 28px rgba(20, 184, 166, 0.22);
        }

        .heartbeat-wave:nth-child(2) {
            width: min(78vw, 930px);
            height: min(48vw, 500px);
            border-color: rgba(59, 130, 246, 0.32);
            animation-delay: -0.28s;
        }

        .heartbeat-wave:nth-child(3) {
            width: min(62vw, 730px);
            height: min(34vw, 340px);
            border-color: rgba(34, 211, 238, 0.4);
            animation-delay: -0.56s;
        }

        .heartbeat-point {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 10px;
            height: 10px;
            margin: -5px 0 0 -5px;
            border-radius: 999px;
            background: #67E8F9;
            box-shadow: 0 0 18px #22D3EE, 0 0 34px rgba(20, 184, 166, 0.9);
            animation: orbitBeat 2.4s linear infinite;
        }

        .heartbeat-point:nth-child(5) {
            animation-duration: 3.1s;
            animation-delay: -1s;
            background: #60A5FA;
        }

        @keyframes heartbeatPulse {
            0%, 100% { scale: 0.96; opacity: 0.42; border-radius: 44% 56% 53% 47%; }
            45% { scale: 1.08; opacity: 0.95; border-radius: 52% 48% 46% 54%; }
            58% { scale: 1.02; opacity: 0.72; }
        }

        @keyframes orbitBeat {
            from { transform: rotate(0deg) translateX(min(36vw, 430px)); }
            to { transform: rotate(360deg) translateX(min(36vw, 430px)); }
        }

        .cinematic-card {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(78vw, 360px);
            aspect-ratio: 1 / 1.15;
            transform: translate(-50%, -50%) scale(0.72) rotateX(18deg) rotateZ(-8deg);
            opacity: 0;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.88);
            border: 2px solid rgba(94, 234, 212, 0.75);
            box-shadow: 0 0 42px rgba(20, 184, 166, 0.52), 0 26px 70px rgba(0, 0, 0, 0.52);
            transition: transform 520ms cubic-bezier(0.18, 1.4, 0.28, 1), opacity 320ms ease;
            z-index: 3;
        }

        .cinematic-card.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) rotateX(0deg) rotateZ(0deg);
        }

        .cinematic-card.exit {
            opacity: 0;
            transform: translate(-50%, -54%) scale(0.82) rotateX(-14deg) rotateZ(8deg);
        }

        .cinematic-card img {
            width: 100%;
            height: 72%;
            object-fit: cover;
            filter: saturate(1.08) contrast(1.05);
        }

        .cinematic-card-body {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 28px 22px 24px;
            text-align: center;
            background: linear-gradient(180deg, transparent, rgba(2, 6, 23, 0.94) 28%);
        }

        .cinematic-artist {
            font-size: clamp(26px, 5vw, 44px);
            line-height: 1;
            font-weight: 900;
            text-shadow: 0 0 18px rgba(20, 184, 166, 0.72);
        }

        .cinematic-snippet {
            margin-top: 9px;
            color: #CCFBF1;
            font-size: 14px;
            text-shadow: 0 0 16px rgba(34, 211, 238, 0.62);
        }

        .cinematic-loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            background: radial-gradient(circle at center, rgba(20, 184, 166, 0.13), rgba(2, 6, 23, 0.84) 58%);
        }

        .cinematic-loader-card {
            width: min(82vw, 380px);
            padding: 28px;
            border: 1px solid rgba(94, 234, 212, 0.22);
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.82);
            box-shadow: 0 0 42px rgba(20, 184, 166, 0.18);
            text-align: center;
        }

        .cinematic-loader-track {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.16);
            margin-top: 18px;
        }

        .cinematic-loader-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #2563EB, #14B8A6, #67E8F9);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.44);
            transition: width 220ms ease;
        }
    </style>
</head>

<script>
// ============================================
// 0. Progress UI Helpers
// ============================================
class ProgressUI {
    constructor(containerId, barId, labelId = null) {
        this.container = document.getElementById(containerId);
        this.bar = document.getElementById(barId);
        this.label = labelId ? document.getElementById(labelId) : null;
        this.value = 0;
    }

    start(label = 'Working...') {
        this.value = 0;
        this.container?.classList.add('active');
        this.set(4, label);
    }

    set(percent, label = null) {
        this.value = Math.max(this.value, Math.min(100, Math.round(percent)));
        if (this.bar) this.bar.style.width = `${this.value}%`;
        if (this.label && label) this.label.textContent = `${label} ${this.value}%`;
    }

    done(label = 'Done') {
        this.set(100, label);
        setTimeout(() => this.container?.classList.remove('active'), 450);
    }
}

// ============================================
// 1. API Client Module
// ============================================
class APIClient {
    constructor(apiKey, username) {
        this.apiKey = apiKey;
        this.username = username;
        this.baseUrl = 'https://ws.audioscrobbler.com/2.0/';
    }

    async fetch(params) {
        const url = new URL(this.baseUrl);
        url.searchParams.append('api_key', this.apiKey);
        url.searchParams.append('format', 'json');
        
        Object.entries(params).forEach(([key, value]) => {
            if (value !== undefined && value !== null) {
                url.searchParams.append(key, value);
            }
        });

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.error) {
                const errorMsg = this.getErrorMessage(data.error);
                throw new Error(errorMsg);
            }
            return data;
        } catch (err) {
            throw err;
        }
    }

    getErrorMessage(code) {
        const errors = {
            2: 'Invalid service',
            3: 'Invalid method',
            4: 'Authentication failed - Invalid token',
            5: 'Invalid format',
            6: 'Invalid parameters - User not found',
            7: 'Invalid resource specified',
            8: 'Operation failed',
            9: 'Invalid session key',
            10: 'Invalid API key - Please check your API key',
            11: 'Service offline',
            13: 'Invalid method signature',
            16: 'There was a temporary error processing your request',
            26: 'Suspended API key',
            29: 'Rate limit exceeded'
        };
        return errors[code] || `API Error: ${code}`;
    }

    async getUserInfo() {
        return this.fetch({
            method: 'user.getInfo',
            user: this.username
        });
    }

    async getRecentTracks(limit = 50, page = 1, from = null, to = null) {
        return this.fetch({
            method: 'user.getRecentTracks',
            user: this.username,
            limit: limit,
            page: page,
            from: from,
            to: to
        });
    }

    async getTopArtists(period = 'overall', limit = 50) {
        return this.fetch({
            method: 'user.getTopArtists',
            user: this.username,
            period: period,
            limit: limit
        });
    }

    async getTopTracks(period = 'overall', limit = 50) {
        return this.fetch({
            method: 'user.getTopTracks',
            user: this.username,
            period: period,
            limit: limit
        });
    }

    async getTopAlbums(period = 'overall', limit = 50) {
        return this.fetch({
            method: 'user.getTopAlbums',
            user: this.username,
            period: period,
            limit: limit
        });
    }

    async getArtistTopAlbums(artistName, limit = 5) {
        return this.fetch({
            method: 'artist.getTopAlbums',
            artist: artistName,
            limit: limit
        });
    }

    async getArtistInfo(artistName) {
        return this.fetch({
            method: 'artist.getInfo',
            artist: artistName
        });
    }
}

// ============================================
// 2. Auth Manager Module
// ============================================
class AuthManager {
    constructor() {
        this.storageKey = 'lastfm_auth';
    }

    save(apiKey, username) {
        const auth = { apiKey, username };
        localStorage.setItem(this.storageKey, JSON.stringify(auth));
    }

    load() {
        const data = localStorage.getItem(this.storageKey);
        return data ? JSON.parse(data) : null;
    }

    clear() {
        localStorage.removeItem(this.storageKey);
    }

    isAuthenticated() {
        return this.load() !== null;
    }
}

// ============================================
// 3. Local IndexedDB Cache
// ============================================
class LocalCache {
    constructor(username) {
        this.username = username;
        this.dbName = `lastfm_dashboard_${username}`;
        this.version = 2;
        this.db = null;
    }

    async open() {
        if (this.db) return this.db;

        this.db = await new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.version);

            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains('scrobbles')) {
                    const scrobbles = db.createObjectStore('scrobbles', { keyPath: 'id' });
                    scrobbles.createIndex('timestamp', 'timestamp', { unique: false });
                    scrobbles.createIndex('artistName', 'artistName', { unique: false });
                }
                if (!db.objectStoreNames.contains('artwork')) {
                    db.createObjectStore('artwork', { keyPath: 'key' });
                }
                if (!db.objectStoreNames.contains('meta')) {
                    db.createObjectStore('meta', { keyPath: 'key' });
                }
                if (!db.objectStoreNames.contains('analytics')) {
                    db.createObjectStore('analytics', { keyPath: 'key' });
                }
            };

            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });

        return this.db;
    }

    async getAll(storeName) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
            const request = db.transaction(storeName, 'readonly').objectStore(storeName).getAll();
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error);
        });
    }

    async putMany(storeName, items) {
        if (!items || items.length === 0) return;

        const db = await this.open();
        await new Promise((resolve, reject) => {
            const transaction = db.transaction(storeName, 'readwrite');
            const store = transaction.objectStore(storeName);
            items.forEach(item => store.put(item));
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error);
        });
    }

    async getMeta(key, fallback = null) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
            const request = db.transaction('meta', 'readonly').objectStore('meta').get(key);
            request.onsuccess = () => resolve(request.result?.value ?? fallback);
            request.onerror = () => reject(request.error);
        });
    }

    async setMeta(key, value) {
        await this.putMany('meta', [{ key, value }]);
    }

    async getAnalytics(key, fallback = null) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
            const request = db.transaction('analytics', 'readonly').objectStore('analytics').get(key);
            request.onsuccess = () => resolve(request.result?.value ?? fallback);
            request.onerror = () => reject(request.error);
        });
    }

    async setAnalytics(key, value) {
        await this.putMany('analytics', [{ key, value, updatedAt: Date.now() }]);
    }

    async getArtwork(key) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
            const request = db.transaction('artwork', 'readonly').objectStore('artwork').get(key);
            request.onsuccess = () => resolve(request.result || null);
            request.onerror = () => reject(request.error);
        });
    }

    async getArtworkMany(keys) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('artwork', 'readonly');
            const store = tx.objectStore('artwork');
            const results = new Map();

            keys.forEach(key => {
                const request = store.get(key);
                request.onsuccess = () => {
                    if (request.result) results.set(key, request.result);
                };
                request.onerror = () => reject(request.error);
            });

            tx.oncomplete = () => resolve(results);
            tx.onerror = () => reject(tx.error);
        });
    }

    async saveArtwork(item) {
        await this.putMany('artwork', [{ ...item, updatedAt: Date.now() }]);
    }

    async fetchImageBlob(imageUrl, timeoutMs = 3500) {
        if (!imageUrl) return null;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

        try {
            const response = await fetch(imageUrl, { signal: controller.signal });
            if (!response.ok) return null;
            return await response.blob();
        } catch (err) {
            return null;
        } finally {
            clearTimeout(timeoutId);
        }
    }

    createArtworkObjectUrl(artwork) {
        if (artwork?.imageBlob instanceof Blob) {
            return URL.createObjectURL(artwork.imageBlob);
        }
        return artwork?.imageDataUrl || artwork?.imageUrl || '';
    }

    blobToDataUrl(blob) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result || '');
            reader.onerror = () => resolve('');
            reader.readAsDataURL(blob);
        });
    }

    dataUrlToBlob(dataUrl) {
        const [header, payload] = String(dataUrl).split(',');
        const mime = header.match(/data:(.*?);base64/)?.[1] || 'application/octet-stream';
        const binary = atob(payload || '');
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return new Blob([bytes], { type: mime });
    }

    normalizeTrack(track) {
        const timestamp = parseInt(track.date?.uts) || 0;
        if (!timestamp) return null;

        const artistName = typeof track.artist === 'string'
            ? track.artist.trim()
            : String(track.artist?.['#text'] || track.artist?.name || '').trim();
        if (!artistName) return null;

        const trackName = String(track.name || '').trim();
        const albumName = String(track.album?.['#text'] || track.album?.name || '').trim();
        const image = Array.isArray(track.image)
            ? track.image.map(img => ({ size: img.size || '', '#text': img['#text'] || '' }))
            : [];
        const imageUrl = [...image].reverse().find(img => img['#text'])?.['#text'] || '';
        const id = [
            timestamp,
            artistName.toLowerCase(),
            trackName.toLowerCase(),
            albumName.toLowerCase()
        ].join('|');

        return {
            id,
            timestamp,
            artistName,
            trackName,
            albumName,
            image,
            imageUrl,
            raw: track
        };
    }

    toLastFmTrack(record) {
        return {
            name: record.trackName,
            artist: { '#text': record.artistName, name: record.artistName },
            album: { '#text': record.albumName },
            date: { uts: String(record.timestamp) },
            image: record.image || []
        };
    }

    async saveTracks(tracks) {
        const normalized = tracks.map(track => this.normalizeTrack(track)).filter(Boolean);
        const artwork = normalized
            .filter(track => track.imageUrl)
            .map(track => ({
                key: `track:${track.artistName}:${track.trackName}`,
                type: 'track',
                artistName: track.artistName,
                trackName: track.trackName,
                imageUrl: track.imageUrl,
                updatedAt: Date.now()
            }));

        await this.putMany('scrobbles', normalized);
        await this.putMany('artwork', artwork);

        const newestTimestamp = normalized.reduce((max, track) => Math.max(max, track.timestamp), await this.getMeta('lastScrobbleTimestamp', 0));
        const previousOldestTimestamp = await this.getMeta('oldestScrobbleTimestamp', Number.MAX_SAFE_INTEGER);
        const oldestTimestamp = normalized.reduce((min, track) => Math.min(min, track.timestamp), previousOldestTimestamp);
        if (newestTimestamp) {
            await this.setMeta('lastScrobbleTimestamp', newestTimestamp);
        }
        if (oldestTimestamp < Number.MAX_SAFE_INTEGER) {
            await this.setMeta('oldestScrobbleTimestamp', oldestTimestamp);
        }
    }

    async getTracks() {
        const records = await this.getAll('scrobbles');
        return records
            .sort((a, b) => a.timestamp - b.timestamp)
            .map(record => this.toLastFmTrack(record));
    }

    async getYears() {
        const records = await this.getAll('scrobbles');
        return [...new Set(records.map(record => new Date(record.timestamp * 1000).getFullYear()))]
            .filter(Boolean)
            .sort((a, b) => b - a);
    }

    async exportData() {
        const [scrobbles, artwork, meta] = await Promise.all([
            this.getAll('scrobbles'),
            this.getAll('meta')
        ]);

        return {
            app: 'lastfm-dashboard',
            version: this.version,
            username: this.username,
            exportedAt: new Date().toISOString(),
            stores: { scrobbles, meta }
        };
    }

    async exportImageData() {
        const artwork = await this.getAll('artwork');
        const serialized = await Promise.all(artwork.map(async item => {
            const imageData = item.imageBlob instanceof Blob
                ? await this.blobToDataUrl(item.imageBlob)
                : (item.imageDataUrl || '');
            const { imageBlob, ...rest } = item;
            return {
                ...rest,
                imageData,
                mimeType: item.imageBlob?.type || item.mimeType || ''
            };
        }));

        return {
            app: 'lastfm-dashboard-image-cache',
            version: this.version,
            username: this.username,
            exportedAt: new Date().toISOString(),
            artwork: serialized
        };
    }

    async importData(data) {
        if (!data?.stores) {
            throw new Error('Invalid cache backup file');
        }

        await this.putMany('scrobbles', data.stores.scrobbles || []);
        await this.putMany('meta', data.stores.meta || []);
    }

    async importImageData(data) {
        if (!data?.artwork && !data?.stores?.artwork) {
            throw new Error('Invalid image cache backup file');
        }

        const artwork = data.artwork || data.stores.artwork || [];
        const restored = artwork.map(item => {
            const imageBlob = item.imageData
                ? this.dataUrlToBlob(item.imageData)
                : (item.imageDataUrl ? this.dataUrlToBlob(item.imageDataUrl) : null);
            const { imageData, imageDataUrl, ...rest } = item;
            return {
                ...rest,
                imageBlob,
                mimeType: imageBlob?.type || item.mimeType || '',
                updatedAt: item.updatedAt || Date.now()
            };
        }).filter(item => item.imageBlob || item.imageUrl);

        await this.putMany('artwork', restored);
    }
}

// ============================================
// 4. Data Processor for Bar Chart Race
// ============================================
class DataProcessor {
    constructor(apiClient) {
        this.apiClient = apiClient;
    }

    async fetchAllRecentTracks(fromDate = null, toDate = null, maxTracks = null, onProgress = null) {
        const allTracks = [];
        let page = 1;
        let hasMore = true;
        const requestedFromDate = fromDate || null;

        while (hasMore) {
            try {
                const data = await this.apiClient.getRecentTracks(200, page, requestedFromDate, toDate);
                const tracks = data.recenttracks?.track || [];
                
                if (!Array.isArray(tracks)) {
                    if (tracks && tracks.name) allTracks.push(tracks);
                    break;
                }

                allTracks.push(...tracks);

                const attr = data.recenttracks?.['@attr'] || {};
                page = parseInt(attr.page) + 1;
                const totalPages = parseInt(attr.totalPages) || 1;
                if (onProgress) {
                    onProgress({
                        loaded: allTracks.length,
                        page: parseInt(attr.page) || page - 1,
                        totalPages
                    });
                }

                hasMore = page <= totalPages && (maxTracks === null || allTracks.length < maxTracks);
            } catch (err) {
                console.error('Error fetching tracks:', err);
                break;
            }
        }

        return allTracks;
    }

    getLocalDateKey(timestampSeconds) {
        const date = new Date(timestampSeconds * 1000);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    dateFromLocalKey(dateKey) {
        const [year, month, day] = dateKey.split('-').map(Number);
        return new Date(year, month - 1, day);
    }

    buildTemporalData(tracks) {
        if (!tracks || tracks.length === 0) {
            console.log('No tracks provided');
            return [];
        }

        const intervals = new Map();
        const globalArtistCounts = {};
        const globalArtistImages = {};

        console.log('Processing', tracks.length, 'tracks');

        // First pass: extract all artist data
        tracks.forEach((track, idx) => {
            try {
                const dateUts = track.date?.uts;
                const date = parseInt(dateUts) || 0;
                
                if (!date) {
                    return;
                }

                // Extract artist name - handle Last.fm API format
                let artistName = '';
                if (typeof track.artist === 'string') {
                    artistName = track.artist.trim();
                } else if (track.artist && track.artist['#text']) {
                    // Last.fm API returns artist as {#text: 'Artist Name', mbid: '...'}
                    artistName = String(track.artist['#text']).trim();
                } else if (track.artist && track.artist.name) {
                    artistName = String(track.artist.name).trim();
                }

                if (!artistName || artistName === '[object Object]') {
                    return;
                }

                // Extract image
                let artistImage = '';
                if (track.image && Array.isArray(track.image) && track.image.length > 0) {
                    const lastImage = track.image[track.image.length - 1];
                    artistImage = lastImage?.['#text'] || '';
                }

                // Group by local calendar day.
                const dateKey = this.getLocalDateKey(date);
                if (!intervals.has(dateKey)) {
                    intervals.set(dateKey, []);
                }
                intervals.get(dateKey).push({
                    artistName: artistName,
                    image: artistImage
                });

                // Store globally
                globalArtistCounts[artistName] = (globalArtistCounts[artistName] || 0) + 1;
                if (!globalArtistImages[artistName] && artistImage) {
                    globalArtistImages[artistName] = artistImage;
                }
            } catch (e) {
                console.error('Error processing track', idx, e);
            }
        });

        console.log('Unique artists found:', Object.keys(globalArtistCounts).length);
        console.log('Daily intervals created:', intervals.size);
        console.log('Sample artists:', Object.keys(globalArtistCounts).slice(0, 5));

        const sortedIntervals = [...intervals.keys()].sort();
        const temporalData = [];
        const cumulativeArtists = {};

        sortedIntervals.forEach(dateKey => {
            // Add counts from this local day.
            intervals.get(dateKey).forEach(item => {
                if (item.artistName) {
                    cumulativeArtists[item.artistName] = (cumulativeArtists[item.artistName] || 0) + 1;
                }
            });

            // Create snapshot with top 10
            const snapshot = Object.entries(cumulativeArtists)
                .map(([name, count]) => ({
                    artist: name,
                    playcount: count,
                    image: globalArtistImages[name] || null
                }))
                .sort((a, b) => b.playcount - a.playcount)
                .slice(0, 10);

            if (snapshot.length > 0) {
                const frameDate = this.dateFromLocalKey(dateKey);
                temporalData.push({
                    timestamp: Math.floor(frameDate.getTime() / 1000),
                    date: frameDate,
                    dateKey,
                    artists: snapshot
                });
            }
        });

        console.log('Temporal data frames:', temporalData.length);
        if (temporalData.length > 0) {
            console.log('First frame artists:', temporalData[0].artists.length, temporalData[0].artists.map(a => a.artist));
            console.log('Last frame artists:', temporalData[temporalData.length - 1].artists.length);
        }

        return temporalData;
    }
}

// ============================================
// 5. Obsession Analytics Engine
// ============================================
class ObsessionAnalytics {
    constructor(cache) {
        this.cache = cache;
        this.chunkSize = 2500;
    }

    idle() {
        return new Promise(resolve => {
            const run = () => resolve();
            if ('requestIdleCallback' in window) {
                requestIdleCallback(run, { timeout: 80 });
            } else {
                setTimeout(run, 0);
            }
        });
    }

    trackKey(record) {
        return `${record.artistName} - ${record.trackName}`;
    }

    monthLabel(timestamp) {
        return new Date(timestamp * 1000).toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
    }

    dateRange(start, end) {
        const options = { year: 'numeric', month: 'short', day: 'numeric' };
        return `${new Date(start * 1000).toLocaleDateString('en-US', options)} - ${new Date(end * 1000).toLocaleDateString('en-US', options)}`;
    }

    monthKey(timestamp) {
        const date = new Date(timestamp * 1000);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    buildYearBaselines(scrobbles) {
        const yearlyTotals = scrobbles.reduce((totals, item) => {
            const year = new Date(item.timestamp * 1000).getFullYear();
            totals[year] = (totals[year] || 0) + 1;
            return totals;
        }, {});

        return Object.fromEntries(Object.entries(yearlyTotals).map(([year, total]) => [year, {
            total,
            track48h: Math.max(12, Math.min(30, Math.ceil(total * 0.003))),
            track7d: Math.max(20, Math.min(50, Math.ceil(total * 0.005))),
            artist3d: Math.max(15, Math.min(40, Math.ceil(total * 0.004)))
        }]));
    }

    overlaps(a, b) {
        return a.start <= b.end && b.start <= a.end;
    }

    isBetterPeak(candidate, current) {
        if (!current) return true;
        if (candidate.count !== current.count) return candidate.count > current.count;
        if (candidate.score !== current.score) return candidate.score > current.score;
        const candidateSpan = candidate.end - candidate.start;
        const currentSpan = current.end - current.start;
        if (candidateSpan !== currentSpan) return candidateSpan < currentSpan;
        return candidate.start < current.start;
    }

    resolveOverlappingPeaks(candidates) {
        const grouped = candidates.reduce((groups, item) => {
            const key = `${item.type}|${item.key}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(item);
            return groups;
        }, new Map());

        const resolved = [];
        grouped.forEach(items => {
            const sorted = items.slice().sort((a, b) => a.start - b.start || b.count - a.count);
            let cluster = [];

            const flushCluster = () => {
                if (!cluster.length) return;
                const best = cluster.reduce((peak, item) => this.isBetterPeak(item, peak) ? item : peak, null);
                resolved.push(best);
                cluster = [];
            };

            sorted.forEach(item => {
                if (!cluster.length || cluster.some(existing => this.overlaps(existing, item))) {
                    cluster.push(item);
                } else {
                    flushCluster();
                    cluster.push(item);
                }
            });
            flushCluster();
        });

        return resolved.sort((a, b) => a.start - b.start);
    }

    resolveArtistMonthPeaks(candidates) {
        const grouped = candidates.reduce((groups, item) => {
            const key = `${item.artistName}|${item.monthKey}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(item);
            return groups;
        }, new Map());

        const resolved = [];
        grouped.forEach(items => {
            const sorted = items.slice().sort((a, b) => a.start - b.start || b.count - a.count);
            let cluster = [];

            const flushCluster = () => {
                if (!cluster.length) return;
                const best = cluster.reduce((peak, item) => this.isBetterPeak(item, peak) ? item : peak, null);
                best.clusterCount = cluster.length;
                resolved.push(best);
                cluster = [];
            };

            sorted.forEach(item => {
                if (!cluster.length || cluster.some(existing => this.overlaps(existing, item))) {
                    cluster.push(item);
                } else {
                    flushCluster();
                    cluster.push(item);
                }
            });
            flushCluster();
        });

        return resolved.sort((a, b) => a.start - b.start);
    }

    async compute(onProgress = null) {
        const analyticsVersion = 4;
        const scrobbles = (await this.cache.getAll('scrobbles'))
            .map(item => ({ ...item, timestamp: Number(item.timestamp || 0) }))
            .filter(item => Number.isFinite(item.timestamp) && item.timestamp > 0 && item.artistName && item.trackName)
            .sort((a, b) => a.timestamp - b.timestamp);
        const latestTimestamp = scrobbles.at(-1)?.timestamp || 0;
        const cached = await this.cache.getAnalytics('obsessionIndex');

        if (cached?.analyticsVersion === analyticsVersion && cached?.latestTimestamp === latestTimestamp && cached?.totalScrobbles === scrobbles.length) {
            onProgress?.(100, 'Loaded cached obsessions');
            return cached;
        }

        const yearBaselines = this.buildYearBaselines(scrobbles);
        const topTrackStreaks = [];
        const topArtistStreaks = [];
        const windows48h = new Map();
        const windows3d = new Map();
        const windows7d = new Map();
        let currentTrack = null;
        let currentArtist = null;

        const pushTop = (list, streak) => {
            if (!streak || streak.count < 2) return;
            list.push(streak);
            list.sort((a, b) => b.count - a.count || a.start - b.start);
            if (list.length > 5) list.length = 5;
        };

        const closeTrack = () => pushTop(topTrackStreaks, currentTrack);
        const closeArtist = () => pushTop(topArtistStreaks, currentArtist);

        const addWindow = (map, key, record, windowSeconds, minCount) => {
            const queue = map.get(key) || [];
            queue.push(record);
            while (queue.length && record.timestamp - queue[0].timestamp > windowSeconds) queue.shift();
            map.set(key, queue);
            if (queue.length < minCount) return null;
            return {
                key,
                artistName: record.artistName,
                trackName: record.trackName,
                imageUrl: record.imageUrl || '',
                count: queue.length,
                start: queue[0].timestamp,
                end: queue[queue.length - 1].timestamp,
                days: Math.max(1, Math.ceil((queue[queue.length - 1].timestamp - queue[0].timestamp + 1) / 86400)),
                threshold: minCount
            };
        };

        const heavyRotationCandidates = [];
        const seenObsessions = new Set();
        const pushObsession = (type, item) => {
            if (!item) return;
            const id = `${type}|${item.key}|${item.start}|${item.end}`;
            if (seenObsessions.has(id)) return;
            seenObsessions.add(id);
            const score = Math.min(200, (item.count / Math.max(1, item.threshold)) * 100);
            heavyRotationCandidates.push({
                type,
                ...item,
                score,
                month: this.monthLabel(item.start),
                monthKey: this.monthKey(item.start),
                year: new Date(item.start * 1000).getFullYear()
            });
        };

        for (let i = 0; i < scrobbles.length; i++) {
            const record = scrobbles[i];
            const trackKey = this.trackKey(record);
            const recordYear = new Date(record.timestamp * 1000).getFullYear();
            const thresholds = yearBaselines[recordYear] || { track48h: 30, track7d: 50, artist3d: 40 };

            if (!currentTrack || currentTrack.key !== trackKey) {
                closeTrack();
                currentTrack = {
                    key: trackKey,
                    artistName: record.artistName,
                    trackName: record.trackName,
                    imageUrl: record.imageUrl || '',
                    count: 1,
                    start: record.timestamp,
                    end: record.timestamp
                };
            } else {
                currentTrack.count++;
                currentTrack.end = record.timestamp;
            }

            if (!currentArtist || currentArtist.key !== record.artistName) {
                closeArtist();
                currentArtist = {
                    key: record.artistName,
                    artistName: record.artistName,
                    count: 1,
                    start: record.timestamp,
                    end: record.timestamp
                };
            } else {
                currentArtist.count++;
                currentArtist.end = record.timestamp;
            }

            pushObsession('track-48h', addWindow(windows48h, trackKey, record, 48 * 3600, thresholds.track48h));
            pushObsession('track-7d', addWindow(windows7d, trackKey, record, 7 * 86400, thresholds.track7d));
            pushObsession('artist-3d', addWindow(windows3d, record.artistName, record, 3 * 86400, thresholds.artist3d));

            if (i % this.chunkSize === 0) {
                onProgress?.((i / Math.max(1, scrobbles.length)) * 92, 'Analyzing obsessions');
                await this.idle();
            }
        }

        closeTrack();
        closeArtist();

        const topStreaks = topTrackStreaks.map(item => ({
            ...item,
            dateRange: this.dateRange(item.start, item.end)
        }));
        const result = {
            analyticsVersion,
            latestTimestamp,
            totalScrobbles: scrobbles.length,
            computedAt: new Date().toISOString(),
            topStreaks,
            topArtistStreaks,
            yearBaselines,
            heavyRotation: this.resolveArtistMonthPeaks(this.resolveOverlappingPeaks(heavyRotationCandidates))
                .slice(-120)
        };

        await this.cache.setAnalytics('obsessionIndex', result);
        onProgress?.(100, 'Obsession index ready');
        return result;
    }
}

// ============================================
// 4. Bar Chart Race Animation Engine
// ============================================
class BarChartRace {
    constructor(containerId, data) {
        this.container = document.getElementById(containerId);
        this.data = data;
        this.currentIndex = 0;
        this.isPlaying = false;
        this.speed = 1;
        this.animationId = null;
        this.frameStartedAt = 0;
        this.frameDuration = 820;
        this.visibleCount = 10;
        this.rowHeight = 62;
        this.rowGap = 12;
        this.colorMap = new Map();
        this.rowMap = new Map();
        this.previousLeader = null;
        this.initializeColors();
        this.setupUI();
    }

    initializeColors() {
        const palette = [
            '#2563EB', '#059669', '#D97706', '#7C3AED', '#DC2626',
            '#0891B2', '#BE123C', '#4F46E5', '#65A30D', '#9333EA',
            '#0F766E', '#B45309', '#1D4ED8', '#9F1239'
        ];

        this.data.forEach(frame => {
            frame.artists.forEach(artist => {
                if (!this.colorMap.has(artist.artist)) {
                    this.colorMap.set(artist.artist, palette[this.colorMap.size % palette.length]);
                }
            });
        });
    }

    setupUI() {
        this.container.innerHTML = `
            <div class="flex flex-col gap-4">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="flex gap-2">
                        <button id="playBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded">Play</button>
                        <button id="pauseBtn" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 rounded">Pause</button>
                        <button id="resetBtn" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 rounded">Reset</button>
                    </div>
                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2">
                            Speed:
                            <select id="speedSelect" class="bg-gray-700 px-2 py-1 rounded">

        document.getElementById('playBtn').addEventListener('click', () => this.play());
        document.getElementById('pauseBtn').addEventListener('click', () => this.pause());
        document.getElementById('resetBtn').addEventListener('click', () => this.reset());
        document.getElementById('speedSelect').addEventListener('change', (e) => {
            this.speed = parseInt(e.target.value);
            this.frameStartedAt = performance.now();
            this.applySpeedTransitions();
        });
        this.applySpeedTransitions();
    }

    getTransitionDurations() {
        if (this.speed >= 10) {
            return { row: 80, bar: 80, opacity: 80, filter: 60 };
        }
        if (this.speed >= 5) {
            return { row: 180, bar: 180, opacity: 140, filter: 100 };
        }
        if (this.speed >= 2) {
            return { row: 320, bar: 320, opacity: 220, filter: 160 };
        }
        return { row: 520, bar: 520, opacity: 320, filter: 220 };
    }

    applySpeedTransitions() {
        const chartDiv = document.getElementById('chartContainer');
        if (!chartDiv) return;

        const durations = this.getTransitionDurations();
        chartDiv.style.setProperty('--race-row-duration', `${durations.row}ms`);
        chartDiv.style.setProperty('--race-bar-duration', `${durations.bar}ms`);
        chartDiv.style.setProperty('--race-opacity-duration', `${durations.opacity}ms`);
        chartDiv.style.setProperty('--race-filter-duration', `${durations.filter}ms`);
    }

    render() {
        if (!this.data || this.data.length === 0) return;

        const frame = this.data[this.currentIndex];
        const chartDiv = document.getElementById('chartContainer');

        if (!frame || !frame.artists || frame.artists.length === 0) {
            chartDiv.innerHTML = '<div class="text-center py-8 text-gray-400">No data available</div>';
            return;
        }

        const artists = frame.artists.filter(a => a && a.artist).slice(0, this.visibleCount);
        const maxCount = Math.max(...artists.map(a => a.playcount || 0), 1);

        if (!chartDiv.querySelector('.race-date-watermark')) {
            chartDiv.innerHTML = '<div class="race-date-watermark"></div>';
        }

        const activeArtists = new Set();
        const newLeader = artists[0]?.artist || null;

        artists.forEach((item, idx) => {
            const artistName = String(item.artist || 'Unknown').trim();
            const playcount = parseInt(item.playcount) || 0;
            const image = item.image || '';
            const percentage = Math.max(2, (playcount / maxCount) * 100);
            const color = this.colorMap.get(artistName) || this.getColorForArtist(artistName);
            activeArtists.add(artistName);

            let row = this.rowMap.get(artistName);
            if (!row) {
                row = this.createRow(artistName, color);
                chartDiv.appendChild(row.el);
                this.rowMap.set(artistName, row);
            }

            row.rank.textContent = `#${idx + 1}`;
            row.name.textContent = artistName;
            row.value.textContent = playcount.toLocaleString();
            row.avatar.innerHTML = image
                ? `<img src="${this.escapeHtml(image)}" alt="${this.escapeHtml(artistName)}" onerror="this.parentElement.textContent='${this.escapeHtml(this.getInitials(artistName))}'">`
                : this.getInitials(artistName);
            row.avatar.style.background = image ? '#1F2937' : color;
            row.bar.style.width = `${percentage}%`;
            row.el.style.opacity = '1';
            row.el.style.transform = `translate3d(0, ${idx * (this.rowHeight + this.rowGap)}px, 0)`;
            row.el.classList.toggle('is-leader', idx === 0);

            if (idx === 0 && newLeader && newLeader !== this.previousLeader) {
                row.el.classList.remove('leader-bump');
                void row.el.offsetWidth;
                row.el.classList.add('leader-bump');
            }
        });

        this.rowMap.forEach((row, artistName) => {
            if (!activeArtists.has(artistName)) {
                row.el.style.opacity = '0';
                row.el.style.transform = `translate3d(-24px, ${this.visibleCount * (this.rowHeight + this.rowGap)}px, 0)`;
                row.el.classList.remove('is-leader');
            }
        });

        this.previousLeader = newLeader || this.previousLeader;

        const dateDisplay = document.getElementById('dateDisplay');
        if (dateDisplay) {
            dateDisplay.textContent = frame.date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        const watermark = chartDiv.querySelector('.race-date-watermark');
        if (watermark) {
            watermark.textContent = frame.date.toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
        }
    }

    createRow(artistName, color) {
        const row = document.createElement('div');
        row.className = 'race-row';
        row.innerHTML = `
            <div class="race-rank"></div>
            <div class="race-avatar"></div>
            <div class="race-name"></div>
            <div class="race-track"><div class="race-bar"></div></div>
            <div class="race-value"></div>
        `;
        const bar = row.querySelector('.race-bar');
        bar.style.background = `linear-gradient(90deg, ${color}, ${color}D9)`;
        return {
            el: row,
            rank: row.querySelector('.race-rank'),
            avatar: row.querySelector('.race-avatar'),
            name: row.querySelector('.race-name'),
            bar,
            value: row.querySelector('.race-value')
        };
    }

    getInitials(name) {
        return name.split(' ').map(word => word[0]).join('').toUpperCase().slice(0, 2) || 'A';
    }

    escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    getColorForArtist(name) {
        const colors = ['#2563EB', '#059669', '#D97706', '#7C3AED', '#DC2626', '#0891B2', '#BE123C', '#4F46E5'];
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colors[Math.abs(hash) % colors.length];
    }

    animate() {
        if (!this.isPlaying) return;

        const now = performance.now();
        const elapsedTime = now - this.frameStartedAt;
        const intervalMs = this.frameDuration / this.speed;

        if (elapsedTime >= intervalMs) {
            const steps = Math.max(1, Math.floor(elapsedTime / intervalMs));
            this.frameStartedAt = now - (elapsedTime % intervalMs);
            this.currentIndex += steps;

            if (this.currentIndex >= this.data.length) {
                this.currentIndex = this.data.length - 1;
                this.pause();
            }

            this.render();
        }

        this.animationId = requestAnimationFrame(() => this.animate());
    }

    play() {
        if (this.isPlaying) return;
        this.isPlaying = true;
        this.frameStartedAt = performance.now();
        this.animate();
    }

    pause() {
        this.isPlaying = false;
        if (this.animationId) {
            cancelAnimationFrame(this.animationId);
            this.animationId = null;
        }
    }

    reset() {
        this.currentIndex = 0;
        this.frameStartedAt = performance.now();
        this.isPlaying = false;
        this.previousLeader = null;
        this.render();
    }
}
// ============================================
// 5. Dashboard UI Module
// ============================================
class Dashboard {
    constructor(apiClient, authManager) {
        this.apiClient = apiClient;
        this.authManager = authManager;
        this.userInfo = null;
        this.barChartRace = null;
        this.artistAlbumImageCache = {};
        this.objectUrls = new Set();
        this.cache = new LocalCache(apiClient.username);
        this.cachedTracks = null;
        this.cacheStatus = '';
        this.selectedRaceYear = 'all';
        this.historicalBackfillPromise = null;
        this.pageProgress = null;
        this.activeTab = 'history';
        this.recentPollTimer = null;
        this.recentPollIntervalMs = 20000;
        this.isRecentPolling = false;
        this.visibilityHandler = null;
        this.obsessionAnalytics = new ObsessionAnalytics(this.cache);
        this.cinematicItems = [];
        this.cinematicIndex = 0;
        this.cinematicTimer = null;
        this.cinematicFrameTimeout = null;
        this.cinematicSessionId = 0;
        this.obsessionRenderToken = 0;
    }

    getColorForArtist(name) {
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colors[Math.abs(hash) % colors.length];
    }

    getInitials(name) {
        return name.split(' ').map(word => word[0]).join('').toUpperCase().slice(0, 2);
    }

    setPageProgressHandler(handler) {
        this.pageProgress = handler;
    }

    startPageProgress(label) {
        this.pageProgress?.('start', 4, label);
    }

    updatePageProgress(percent, label) {
        this.pageProgress?.('set', percent, label);
    }

    finishPageProgress(label = 'Ready') {
        this.pageProgress?.('done', 100, label);
    }

    getImagePlaceholder(size = 512) {
        const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                <rect width="${size}" height="${size}" fill="#111827"/>
                <circle cx="${size * 0.5}" cy="${size * 0.42}" r="${size * 0.16}" fill="#334155"/>
                <path d="M${size * 0.22} ${size * 0.82}c${size * 0.08}-${size * 0.18} ${size * 0.22}-${size * 0.27} ${size * 0.28}-${size * 0.27}s${size * 0.2} ${size * 0.09} ${size * 0.28} ${size * 0.27}" fill="#334155"/>
            </svg>
        `;
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg.trim())}`;
    }

    sanitizeImageUrl(url, size = 512) {
        const value = String(url || '').trim();
        if (!value) return this.getImagePlaceholder(size);
        if (value.startsWith('blob:') && !this.objectUrls.has(value)) {
            return this.getImagePlaceholder(size);
        }
        return value;
    }

    async getArtworkDisplayUrl(artwork, size = 512) {
        if (artwork?.imageBlob instanceof Blob && window.location.origin === 'null') {
            return await this.cache.blobToDataUrl(artwork.imageBlob) || this.getImagePlaceholder(size);
        }

        const url = this.cache.createArtworkObjectUrl(artwork);
        if (url?.startsWith('blob:')) this.objectUrls.add(url);
        return this.sanitizeImageUrl(url, size);
    }

    getArtistName(artist) {
        if (typeof artist === 'string') return artist;
        return String(artist?.['#text'] || artist?.name || 'Unknown Artist');
    }

    renderRecentScrobblesList(tracks) {
        const list = Array.isArray(tracks) ? tracks : (tracks ? [tracks] : []);
        return list.slice(0, 10).map(track => {
            const artist = this.getArtistName(track.artist);
            const album = track.album?.['#text'] || track.album?.name || 'Unknown Album';
            const timestamp = track.date?.['#text'] || 'Now Playing';
            const imageUrl = this.sanitizeImageUrl(track.image?.[2]?.['#text'] || track.image?.[1]?.['#text'], 64);
            return `
                <div class="bg-gray-800 p-3 rounded flex gap-3 items-start">
                    <img src="${imageUrl}" alt="" class="w-16 h-16 rounded" onerror="this.style.display='none'">
                    <div class="flex-1">
                        <p class="font-semibold text-sm">${String(track.name || 'Unknown Track').substring(0, 50)}</p>
                        <p class="text-gray-400 text-xs">${artist}</p>
                        <p class="text-gray-500 text-xs">${album}</p>
                        <p class="text-gray-600 text-xs">${timestamp}</p>
                    </div>
                </div>
            `;
        }).join('');
    }

    async refreshRecentScrobbles() {
        if (this.isRecentPolling || document.hidden || this.activeTab !== 'history') return;

        const list = document.getElementById('recentScrobblesList');
        if (!list) return;

        this.isRecentPolling = true;
        try {
            const recent = await this.apiClient.getRecentTracks(20);
            const tracks = recent.recenttracks?.track || [];
            list.innerHTML = this.renderRecentScrobblesList(tracks);
        } catch (err) {
            console.warn('Recent scrobble refresh failed:', err);
        } finally {
            this.isRecentPolling = false;
        }
    }

    startRecentPolling() {
        this.stopRecentPolling();
        if (document.hidden || this.activeTab !== 'history') return;

        this.refreshRecentScrobbles();
        this.recentPollTimer = setInterval(() => this.refreshRecentScrobbles(), this.recentPollIntervalMs);
    }

    stopRecentPolling() {
        if (this.recentPollTimer) {
            clearInterval(this.recentPollTimer);
            this.recentPollTimer = null;
        }
    }

    setupVisibilityPolling() {
        if (this.visibilityHandler) return;

        this.visibilityHandler = () => {
            if (document.hidden) {
                this.stopRecentPolling();
            } else if (this.activeTab === 'history') {
                this.startRecentPolling();
            }
        };
        document.addEventListener('visibilitychange', this.visibilityHandler);
    }

    async getArtistAlbumImage(artistName) {
        if (this.artistAlbumImageCache[artistName]) {
            return this.artistAlbumImageCache[artistName];
        }

        try {
            const artworkKey = `artist-album:${artistName}`;
            const cachedArtwork = await this.cache.getArtwork(artworkKey);
            if (cachedArtwork) {
                const cachedImage = await this.getArtworkDisplayUrl(cachedArtwork, 512);
                this.artistAlbumImageCache[artistName] = cachedImage;
                return cachedImage;
            }

            const data = await this.apiClient.getArtistTopAlbums(artistName, 5);
            const albums = data.topalbums?.album || [];
            const albumList = Array.isArray(albums) ? albums : [albums];
            const albumWithImage = albumList.find(album => album?.image?.some(img => img?.['#text']));
            const imageUrl = albumWithImage?.image?.find(img => img.size === 'extralarge')?.['#text'] ||
                           albumWithImage?.image?.find(img => img.size === 'large')?.['#text'] ||
                           albumWithImage?.image?.find(img => img.size === 'medium')?.['#text'] ||
                           albumWithImage?.image?.find(img => img?.['#text'])?.['#text'] ||
                           null;
            let fallbackImageUrl = imageUrl;

            if (!fallbackImageUrl) {
                const artistInfo = await this.apiClient.getArtistInfo(artistName);
                const artistImages = artistInfo.artist?.image || [];
                fallbackImageUrl = artistImages.find(img => img.size === 'extralarge')?.['#text'] ||
                                   artistImages.find(img => img.size === 'large')?.['#text'] ||
                                   artistImages.find(img => img.size === 'medium')?.['#text'] ||
                                   artistImages.find(img => img?.['#text'])?.['#text'] ||
                                   null;
            }

            const displayImage = await this.getCachedArtworkUrl(artworkKey, fallbackImageUrl, {
                type: 'artist-album',
                artistName,
                albumName: albumWithImage?.name || ''
            });
            if (displayImage) this.artistAlbumImageCache[artistName] = displayImage;
            return displayImage;
        } catch (err) {
            return null;
        }
    }

    async loadCachedScrobbles(forceRefresh = false, onProgress = null) {
        if (this.cachedTracks && !forceRefresh) {
            return this.cachedTracks;
        }

        await this.cache.open();
        const processor = new DataProcessor(this.apiClient);
        const lastTimestamp = await this.cache.getMeta('lastScrobbleTimestamp', 0);
        const fromDate = lastTimestamp ? lastTimestamp + 1 : null;
        let fetchedTracks = await processor.fetchAllRecentTracks(fromDate, null, null, onProgress);

        if (fetchedTracks.length > 0) {
            await this.cache.saveTracks(fetchedTracks);
        }

        this.cachedTracks = await this.cache.getTracks();
        this.cacheStatus = `${this.cachedTracks.length.toLocaleString()} cached scrobbles${fetchedTracks.length ? `, ${fetchedTracks.length.toLocaleString()} newly synced` : ', already up to date'}`;
        return this.cachedTracks;
    }

    async shouldRunHistoricalBackfill() {
        await this.cache.open();
        const lastTimestamp = await this.cache.getMeta('lastScrobbleTimestamp', 0);
        const oldestTimestamp = await this.cache.getMeta('oldestScrobbleTimestamp', 0);
        const historicalBackfillDone = await this.cache.getMeta('historicalBackfillComplete', false);
        const startOf2025 = Math.floor(new Date('2025-01-01T00:00:00Z').getTime() / 1000);
        return Boolean(lastTimestamp && !historicalBackfillDone && (!oldestTimestamp || oldestTimestamp >= startOf2025));
    }

    startHistoricalBackfill() {
        if (this.historicalBackfillPromise) return this.historicalBackfillPromise;

        this.historicalBackfillPromise = (async () => {
            try {
                const shouldBackfill = await this.shouldRunHistoricalBackfill();
                if (!shouldBackfill) return false;

                const processor = new DataProcessor(this.apiClient);
                const backfillTracks = await processor.fetchAllRecentTracks(null);
                if (backfillTracks.length > 0) {
                    await this.cache.saveTracks(backfillTracks);
                }
                await this.cache.setMeta('historicalBackfillComplete', true);
                this.cachedTracks = await this.cache.getTracks();
                this.cacheStatus = `${this.cachedTracks.length.toLocaleString()} cached scrobbles, historical backfill complete`;
                return true;
            } catch (err) {
                console.warn('Historical backfill failed:', err);
                return false;
            } finally {
                this.historicalBackfillPromise = null;
            }
        })();

        return this.historicalBackfillPromise;
    }

    filterTracksByYear(tracks, year) {
        if (year === 'all') return tracks;

        const targetYear = parseInt(year);
        return tracks.filter(track => {
            const timestamp = parseInt(track.date?.uts) || 0;
            return timestamp && new Date(timestamp * 1000).getFullYear() === targetYear;
        });
    }

    async getCachedYears() {
        const years = await this.cache.getYears();
        return years.length ? years : [new Date().getFullYear()];
    }

    ensureJSZip() {
        if (!window.JSZip) {
            throw new Error('JSZip is not loaded. Make sure jszip.min.js exists next to index.html.');
        }
        return window.JSZip;
    }

    async downloadZip(filename, jsonFilename, data, onProgress = null) {
        const JSZipLib = this.ensureJSZip();
        const zip = new JSZipLib();
        onProgress?.(8, 'Preparing');
        zip.file(jsonFilename, JSON.stringify(data, null, 2));
        const blob = await zip.generateAsync({
            type: 'blob',
            compression: 'DEFLATE',
            compressionOptions: { level: 6 }
        }, metadata => {
            onProgress?.(8 + (metadata.percent * 0.88), 'Compressing');
        });
        onProgress?.(98, 'Downloading');
        this.downloadBlob(blob, filename);
    }

    downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
    }

    async readJsonOrZip(file, preferredJsonFilename, onProgress = null) {
        onProgress?.(5, 'Reading');
        if (file.name.toLowerCase().endsWith('.zip')) {
            const JSZipLib = this.ensureJSZip();
            onProgress?.(15, 'Opening ZIP');
            const zip = await JSZipLib.loadAsync(file);
            const entry = zip.file(preferredJsonFilename) ||
                zip.file(/\.json$/i).find(item => !item.dir);
            if (!entry) {
                throw new Error('No JSON data file found inside the ZIP archive');
            }
            const text = await entry.async('string', metadata => {
                onProgress?.(15 + (metadata.percent * 0.7), 'Extracting');
            });
            onProgress?.(90, 'Restoring');
            return JSON.parse(text);
        }

        onProgress?.(65, 'Reading JSON');
        return JSON.parse(await file.text());
    }

    async exportCache(onProgress = null) {
        const data = await this.cache.exportData();
        const safeUser = this.apiClient.username.replace(/[^a-z0-9_-]/gi, '_');
        await this.downloadZip(
            `lastfm-cache-${safeUser}-${new Date().toISOString().slice(0, 10)}.zip`,
            'lastfm-cache.json',
            data,
            onProgress
        );

    revokeArtworkObjectUrls() {

    async getCachedArtworkUrl(key, imageUrl, metadata = {}) {
        if (!imageUrl) return '';

        const cachedArtwork = await this.cache.getArtwork(key);
        if (cachedArtwork) {
            const cachedImage = await this.getArtworkDisplayUrl(cachedArtwork, 512);
            return cachedImage;
        }

        const imageBlob = await this.cache.fetchImageBlob(imageUrl);
        const displayImage = imageBlob ? URL.createObjectURL(imageBlob) : imageUrl;
        if (displayImage?.startsWith('blob:')) this.objectUrls.add(displayImage);

        await this.cache.saveArtwork({
            key,
            ...metadata,
            imageUrl,
            imageBlob,
            mimeType: imageBlob?.type || ''
        });

        return displayImage;
    }

    async hydrateRaceArtwork(tracks) {
        const artistImages = new Map();
        const artistCounts = new Map();

        tracks.forEach(track => {
            const artistName = typeof track.artist === 'string'
                ? track.artist.trim()
                : String(track.artist?.['#text'] || track.artist?.name || '').trim();
            const imageUrl = Array.isArray(track.image)
                ? [...track.image].reverse().find(img => img?.['#text'])?.['#text']
                : '';

            if (artistName && imageUrl && !artistImages.has(artistName)) {
                artistImages.set(artistName, imageUrl);
            }
            if (artistName) {
                artistCounts.set(artistName, (artistCounts.get(artistName) || 0) + 1);
            }
        });

        const hydratedImages = new Map();
        const raceArtists = [...artistCounts.entries()]
            .sort((a, b) => b[1] - a[1])
            .slice(0, 25)
            .map(([artistName]) => artistName)
            .filter(artistName => artistImages.has(artistName));

        const concurrency = 6;
        for (let i = 0; i < raceArtists.length; i += concurrency) {
            const batch = raceArtists.slice(i, i + concurrency);
            const results = await Promise.all(batch.map(async artistName => {
                const imageUrl = artistImages.get(artistName);
                const cachedUrl = await this.getCachedArtworkUrl(`race-artist:${artistName}`, imageUrl, {
                    type: 'race-artist',
                    artistName
                });
                return [artistName, cachedUrl || imageUrl];
            }));
            results.forEach(([artistName, imageUrl]) => hydratedImages.set(artistName, imageUrl));
        }

        return tracks.map(track => {
            const artistName = typeof track.artist === 'string'
                ? track.artist.trim()
                : String(track.artist?.['#text'] || track.artist?.name || '').trim();
            const cachedUrl = hydratedImages.get(artistName);
            if (!cachedUrl || !Array.isArray(track.image) || track.image.length === 0) return track;

            const image = track.image.map((img, index) => ({
                ...img,
                '#text': index === track.image.length - 1 ? cachedUrl : img['#text']
            }));
            return { ...track, image };
        });
    }
